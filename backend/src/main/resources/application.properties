# =====================================================
# QUANTARA — SPRING BOOT CONFIGURATION
# =====================================================

spring.application.name=quantara-backend
spring.devtools.add-properties=false
spring.devtools.livereload.enabled=false
app.ollama.url=${OLLAMA_URL:http://127.0.0.1:11434}
app.ollama.model=${OLLAMA_MODEL:qwen2.5-coder:3b}
app.ml.url=${ML_SERVICE_URL:http://127.0.0.1:8001}

# =====================================================
# SERVER CONFIGURATION
# =====================================================

server.port=${PORT:8080}
server.forward-headers-strategy=framework
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-part-count=5

# =====================================================
# NEON POSTGRESQL DATABASE
# =====================================================

# Database credentials are loaded from environment variables.
# Never hardcode database passwords here.
# For local PowerShell startup with a hidden password prompt, use start-local.ps1.
# DATABASE_URL must be a JDBC URL without embedded user/password parameters.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# DATABASE CONNECTION POOL — HIKARICP
# =====================================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30

# =====================================================
# SPRING DATA JDBC
# =====================================================

spring.sql.init.mode=never

# =====================================================
# FLYWAY DATABASE MIGRATIONS
# =====================================================

spring.flyway.enabled=true
spring.flyway.connect-retries=3
# Flyway intentionally shares the datasource and its environment credentials.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# =====================================================
# SESSION SECURITY
# =====================================================

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Enable secure cookies when using HTTPS in production.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.servlet.session.timeout=30m

# =====================================================
# ERROR HANDLING
# =====================================================

server.error.include-message=never
server.error.include-stacktrace=never

# =====================================================
# SPRING BOOT ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =====================================================
# LOGGING
# =====================================================

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc=INFO
