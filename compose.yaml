services:
  api:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the clean Neon JDBC URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set the Neon username}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set the password securely}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?Set a random shared service secret}
      ML_SERVICE_URL: http://ml:8001
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5-coder:3b
    depends_on: [ml]
  ml:
    build: ./ml-service
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?Set the same service secret}
    # Private Docker network only. The browser talks exclusively to Spring Boot.
